spring.application.name=ProjetoSanquim
# Credenciais/tokens salvos em variaveis de ambiente


# Configuracao Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# Exibicao e formatacao de SQL no Console
spring.jpa.show-sql=true

# Cria e atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Impede que o Hibernate busque informacoes adicionais no banco de dados automaticamente
spring.jpa.open-in-view=false

# JWT Security
jws.secret=${JWS_SECRET}
jws.expiration=36000000