spring.application.name=ProjetoSanquim
# Credenciais/tokens estão salvos em Variaveis de ambiente


# Configuração Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# Exibição e formatação de SQL no Console
spring.jpa.show-sql=true

# Crie e atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Impede que o Hibernate busque informações adicionais no banco de dados automaticamente
spring.jpa.open-in-view=false

# JWT Security
jws.secret:${JWS_SECRET}
jws.expiration=36000000